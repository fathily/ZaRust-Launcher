name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Install Android NDK for the on-device Rust Builder
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install "ndk;25.2.9519653"

      - name: Install Android SDK Platform 37.0 and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root" || { echo "Android SDK root is unavailable" >&2; exit 1; }
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path" || { echo "sdkmanager was not found" >&2; exit 1; }
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;25.2.9519653"
          platform_dir="$sdk_root/platforms/android-37.0"
          test -f "$platform_dir/android.jar" || { echo "Android SDK Platform 37.0 was not installed" >&2; exit 1; }
          compat_dir="$sdk_root/platforms/android-37"
          if [[ ! -e "$compat_dir" ]]; then ln -s "android-37.0" "$compat_dir"; fi
          test -f "$compat_dir/android.jar" || { echo "Android SDK Platform 37 compatibility path is unavailable" >&2; exit 1; }
      - name: Build Debug APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ matrix.arch }} -PrustEditionEnabled=${{ matrix.arch == 'all' || matrix.arch == 'arm64' }}

      - name: Upload Debug APK for ${{ matrix.arch }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          archive: false
