name: Build ZaRust Android native mod engine

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      mods:
        description: Approved native mod IDs (space or comma separated)
        required: true
        default: wrench
        type: string
      app_version:
        description: ZaRust release version (must match gradle.properties)
        required: true
        default: 2.4.11
        type: string

permissions:
  contents: read

jobs:
  request:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[ZaRust native build]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      mods: ${{ steps.read.outputs.mods }}
      app_version: ${{ steps.read.outputs.app_version }}
      build_name: ${{ steps.read.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: read
        name: Validate selected native mod bundles
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.issue.body }}
          INPUT_MODS: ${{ inputs.mods }}
          INPUT_VERSION: ${{ inputs.app_version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(".")
          props = (root / "ZalithLauncher/gradle.properties").read_text()
          match = re.search(r"^launcher_version_name=(.+)$", props, re.M)
          if not match:
              raise SystemExit("Could not read ZaRust app version")
          expected = match.group(1).strip()
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}", expected):
              raise SystemExit("Invalid launcher_version_name in gradle.properties")
          def issue_field(label):
              body = os.environ.get("BODY") or ""
              found = re.search(rf"^### {re.escape(label)}\s*$(.*?)(?=^### |\Z)", body, re.S | re.M)
              return found.group(1).strip() if found else ""
          if os.environ["EVENT"] == "issues":
              version = issue_field("ZaRust app version")
              mods_text = issue_field("Native mod IDs")
          else:
              version = os.environ.get("INPUT_VERSION", "").strip()
              mods_text = os.environ.get("INPUT_MODS", "").strip()
          if version != expected:
              raise SystemExit(f"Requested app version {version!r} does not match source ({expected}).")
          ids = sorted(set(x for x in re.split(r"[\s,]+", mods_text.lower()) if x))
          if not ids:
              raise SystemExit("Name at least one approved native mod.")
          for mod_id in ids:
              if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{0,40}", mod_id):
                  raise SystemExit(f"Invalid mod id: {mod_id[:40]!r}")
              bundle = root / "tools/rust-edition/native-mods" / mod_id / "mixins" / mod_id
              if not (bundle / "horizon-mixin.toml").is_file():
                  raise SystemExit(f"{mod_id!r} is not an approved bundle in tools/rust-edition/native-mods/.")
          name = "v" + version + "__" + "__".join(ids)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("mods=" + " ".join(ids) + "\n")
              out.write("app_version=" + version + "\n")
              out.write("build_name=" + name + "\n")
          PY
      - name: Acknowledge request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" \
            --body "Validated native mod set. Building the arm64 Android game library: [progress]($RUN). Only reviewed bundles committed in this repository can be built."

  build:
    needs: request
    if: always() && needs.request.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.request.outputs.app_version }}
      MODS: ${{ needs.request.outputs.mods }}
      BUILD_NAME: ${{ needs.request.outputs.build_name }}
      CARGO_BUILD_JOBS: 3
      CARGO_TERM_COLOR: always
      PROFILE: fast
    steps:
      - name: Checkout ZaRust scripts and reviewed mod bundles
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tools
      - name: Checkout pinned Starling Android engine
        uses: actions/checkout@v4
        with:
          repository: JuanLuci/starling
          ref: 1d45d81bad530e20cfa18e9b47b1d7247b469ea4
          persist-credentials: false
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android SDK, NDK and build tools
        run: |
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust Android target and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
          rustc --version
          cargo ndk --version
      - name: Make room for Android release compilation
        run: |
          sudo swapoff -a || true
          where=/mnt
          size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP; size=10G; fi
          sudo fallocate -l "$size" "$where/zarust-native.swap"
          sudo chmod 600 "$where/zarust-native.swap"
          sudo mkswap "$where/zarust-native.swap" >/dev/null
          sudo swapon "$where/zarust-native.swap"
      - name: Build selected Horizon native mods into the Android engine
        run: |
          bundles=()
          for id in $MODS; do
            bundles+=("tools/tools/rust-edition/native-mods/$id/mixins/$id")
          done
          bash tools/tools/rust-edition/native_build.sh \
            source out "$APP_VERSION" "${bundles[@]}"
          mv out/libhorizon_android.so "out/$BUILD_NAME.so"
          mv out/build.json "out/$BUILD_NAME.json"
          python3 - "$APP_VERSION" "$BUILD_NAME" <<'PY'
          import json, pathlib, sys
          version, name = sys.argv[1:]
          data = json.loads(pathlib.Path("out/" + name + ".json").read_text())
          if data.get("version") != version or data.get("abi") != "arm64-v8a":
              raise SystemExit("Native build metadata does not match requested app version/ABI")
          library = pathlib.Path("out/" + name + ".so")
          if not library.is_file() or library.stat().st_size != data.get("size"):
              raise SystemExit("Native library size does not match metadata")
          if len(data.get("sha256", "")) != 64:
              raise SystemExit("Native build SHA-256 is missing")
          print("Verified arm64 native library:", library.stat().st_size, "bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zarust-native-${{ needs.request.outputs.build_name }}
          path: |
            out/${{ needs.request.outputs.build_name }}.so
            out/${{ needs.request.outputs.build_name }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [request, build]
    if: always() && needs.request.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download Android engine artifact
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: zarust-native-${{ needs.request.outputs.build_name }}
          path: built
      - name: Publish native library to ZaRust native-builds release
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NAME: ${{ needs.request.outputs.build_name }}
        run: |
          gh release view native-builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create native-builds -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "ZaRust Android native engine builds" \
              --notes "Version-matched arm64-v8a Horizon native-mod libraries for ZaRust. Each .so has a JSON manifest with ABI, app version and SHA-256."
          gh release upload native-builds -R "$GITHUB_REPOSITORY" --clobber \
            "built/$BUILD_NAME.so" "built/$BUILD_NAME.json"
      - name: Report issue result
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ needs.build.result == 'success' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = true ]; then
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" \
              --body "Android native engine build published. Open ZaRust → Settings → Rust Edition → Native Build Manager, refresh, then download and activate it. Native mods run with full game access; install only mods you trust."
            gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" \
              --body "The Android native build failed. [Open the build log]($RUN). The mod bundle may not match the pinned Starling/Horizon source."
          fi
