name: Build ZaRust with Rust Edition

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Android build variant
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: read

concurrency:
  group: zarust-rust-edition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-edition-arm64:
    name: Rust Edition (arm64-v8a) + ZaRust
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      CARGO_TERM_COLOR: always
      BUILD_VARIANT: ${{ github.event.inputs.variant || 'Debug' }}

    steps:
      - name: Checkout ZaRust Launcher
        uses: actions/checkout@v7
        with:
          path: ZaRust

      - name: Checkout pinned Horizon Android source
        uses: actions/checkout@v7
        with:
          repository: Vasysik/horizon-android
          ref: 7301f6fdd7f470b11317276e7a11b4dc615c137a
          path: ZaRust/HorizonEngine

      - name: Checkout Starling official Rust mods
        uses: actions/checkout@v7
        with:
          repository: JuanLuci/starling
          ref: 1d53294cf27dbe676197fdd826669d6b7030d2e1
          path: ZaRust/StarlingMods

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete `tools` package.
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "ndk;27.2.12479018"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ZaRust/HorizonEngine -> target

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Starling official mods for Horizon
        working-directory: ZaRust/StarlingMods
        run: |
          set -euo pipefail
          cargo build --release -p cargo-horizon-mod
          cli="$PWD/target/release/cargo-horizon-mod"
          for mod in fps-overlay keystrokes far-view minimap zoom recipes; do
            echo "::group::Build official mod: $mod"
            (cd "mods/official/$mod" && "$cli" build)
            id=$(grep '^id = ' "mods/official/$mod/horizon-mod.toml" | head -n1 | cut -d '"' -f2)
            test -n "$id"
            test -s "target/horizon-mod/$id.hmod"
            echo "::endgroup::"
          done

      - name: Isolate Horizon data paths
        working-directory: ZaRust
        run: python tools/rust-edition/patch_horizon.py

      - name: Prepare pinned Minecraft engine tables
        working-directory: ZaRust/HorizonEngine
        run: python tools/android_prepare.py

      - name: Compile Horizon Rust native engine
        working-directory: ZaRust/HorizonEngine
        run: |
          python tools/android_build.py --abi arm64-v8a --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --public --rust-only

      - name: Stage Starling official mods
        working-directory: ZaRust
        run: |
          set -euo pipefail
          mods="ZalithLauncher/src/main/assets/zarust-official-mods"
          notices="ZalithLauncher/src/main/assets/rust-edition"
          mkdir -p "$mods" "$notices"
          cp StarlingMods/LICENSE "$notices/STARLING-MODS-LICENSE.txt"
          for id in fps_overlay keystrokes far_view minimap zoom recipes; do
            source="StarlingMods/target/horizon-mod/$id.hmod"
            test -s "$source"
            cp "$source" "$mods/$id.hmod"
          done
          printf '%s\\n' '1d53294cf27dbe676197fdd826669d6b7030d2e1' > "$mods/version.txt"
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("ZalithLauncher/src/main/assets/zarust-official-mods").glob("*.hmod"))
          if len(files) != 6 or any(p.stat().st_size == 0 for p in files):
              raise SystemExit(f"Expected six non-empty official Starling .hmod files, got {files}")
          print("Validated official Rust mods:", ", ".join(p.name for p in files))
          PY

      - name: Stage Rust Edition native library and assets
        working-directory: ZaRust
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, sys
          horizon = Path("HorizonEngine")
          app = Path("ZalithLauncher/src/main")
          library = horizon / "target/aarch64-linux-android/release/libhorizon_android.so"
          if not library.is_file():
              raise SystemExit(f"Missing native library: {library}")
          jni = app / "jniLibs/arm64-v8a"
          jni.mkdir(parents=True, exist_ok=True)
          shutil.copy2(library, jni / "libhorizon_android.so")
          sys.path.insert(0, str(horizon / "tools"))
          import android_build
          engine_data = android_build.engine_data(public=True)
          assets = app / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          shutil.copy2(engine_data, assets / "engine-data.zip")
          notices = assets / "rust-edition"
          notices.mkdir(parents=True, exist_ok=True)
          shutil.copy2(horizon / "LICENSE", notices / "LICENSE.txt")
          shutil.copy2(horizon / "THIRD_PARTY_NOTICES.md", notices / "THIRD_PARTY_NOTICES.md")
          print("Staged libhorizon_android.so and verified public engine data.")
          PY

      - name: Build ZaRust APK with Rust Edition enabled
        working-directory: ZaRust
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ env.BUILD_VARIANT }} -Darch=arm64 -PrustEditionEnabled=true

      - name: Upload combined ZaRust APK
        uses: actions/upload-artifact@v7
        with:
          name: ZaRust-${{ env.BUILD_VARIANT }}-RustEdition-arm64
          path: ZaRust/ZalithLauncher/build/outputs/apk/${{ env.BUILD_VARIANT == 'Release' && 'release' || 'debug' }}/*.apk
          if-no-files-found: error
          archive: false
