name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Android build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Install Android NDK required by the Android project
        run: |
          set -euo pipefail
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --install "ndk;25.2.9519653"

      - name: Install Android SDK Platform 37.0 and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root" || { echo "Android SDK root is unavailable" >&2; exit 1; }
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path" || { echo "sdkmanager was not found" >&2; exit 1; }
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" --channel=3 --install "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "ndk;25.2.9519653"
          platform_dir="$sdk_root/platforms/android-37.0"
          test -f "$platform_dir/android.jar" || { echo "Android SDK Platform 37.0 was not installed" >&2; exit 1; }
          compat_dir="$sdk_root/platforms/android-37"
          if [[ ! -e "$compat_dir" ]]; then ln -s "android-37.0" "$compat_dir"; fi
          test -f "$compat_dir/android.jar" || { echo "Android SDK Platform 37 compatibility path is unavailable" >&2; exit 1; }
      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant || 'Release' }} -Darch=${{ matrix.arch }} -PrustEditionEnabled=${{ matrix.arch == 'all' || matrix.arch == 'arm64' }}

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          # archive:false tek dosya yükler ve zip yapmaz.
          # Bu modda "name" parametresi dikkate alınmaz; artifact adı yüklenen dosyanın adı olur.
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          archive: false

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          archive: false
