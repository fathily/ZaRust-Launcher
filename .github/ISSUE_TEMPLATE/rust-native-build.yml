name: ZaRust Android native mod build
description: Request an arm64 Android engine build with reviewed Horizon native mods
title: "[ZaRust native build] "
body:
  - type: markdown
    attributes:
      value: |
        Request a cloud build of the ZaRust Android Rust Edition game library.
        Only native mod bundles already reviewed and committed under tools/rust-edition/native-mods/ can be built.
        Native mods are not sandboxed and run with the game's full access. Do not request code you do not trust.
  - type: input
    id: version
    attributes:
      label: ZaRust app version
      description: Must match ZalithLauncher/gradle.properties.
      placeholder: "2.4.11"
      value: "2.4.11"
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Native mod IDs
      description: IDs of reviewed bundles in this repository, separated by spaces or commas.
      placeholder: "wrench"
      value: "wrench"
    validations:
      required: true
